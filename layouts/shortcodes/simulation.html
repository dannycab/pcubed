{{- $src := .Get "src" -}}
{{- $title := .Get "title" | default "Interactive simulation" -}}
{{- $aspect := .Get "aspect" | default "75%" -}}
<div class="simulation-embed">
  <div style="position:relative;padding-bottom:{{ $aspect }};height:0;overflow:hidden">
    <iframe src="{{ $src }}" title="{{ $title }}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe>
  </div>
  <p class="simulation-fallback">
    <a href="{{ $src }}" target="_blank" rel="noopener">Open &ldquo;{{ $title }}&rdquo; in a new tab</a>
  </p>
</div>
